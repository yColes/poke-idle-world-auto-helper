name: Importar pacote da extensão
on:
  push:
    branches: [main]
    paths:
      - '*.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    if: github.actor == 'yColes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Importar ZIP e organizar código-fonte
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=( ./*.zip )
          if [ ${#packages[@]} -eq 0 ]; then
            echo "Nenhum ZIP novo na raiz."; exit 0
          fi
          mkdir -p dist
          for package in "${packages[@]}"; do
            echo "Importando $package"
            mkdir -p /tmp/pokeidle-extract
            unzip -oq "$package" -d /tmp/pokeidle-extract
            test -f /tmp/pokeidle-extract/manifest.json
            for file in manifest.json background.js capture-parser.js capture-events.js capture-storage.js content.js popup.html popup.css popup.js; do
              if [ -f "/tmp/pokeidle-extract/$file" ]; then
                cp "/tmp/pokeidle-extract/$file" "./$file"
              fi
            done
            if [ -d /tmp/pokeidle-extract/icons ]; then
              mkdir -p icons
              cp -R /tmp/pokeidle-extract/icons/. icons/
            fi
            cp "$package" "dist/$(basename "$package")"
            rm "$package"
            rm -rf /tmp/pokeidle-extract
          done
      - name: Publicar arquivos e pacote ZIP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: import original extension and downloadable package"
            git push
          fi
      - name: Criar release para download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json;print(json.load(open("manifest.json"))["version"])')
          TAG="v$VERSION"
          PACKAGES=( dist/*.zip )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe."
          else
            gh release create "$TAG" "${PACKAGES[@]}" --title "Auto Helper $TAG" --notes "Versão inicial com arquivos prontos para instalação em navegadores Chromium (Opera GX, Chrome e Edge). Consulte o README para instruções."
          fi
